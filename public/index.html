<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>AI Trading Assistant</title>

    <link
        rel="stylesheet"
        href="style.css"
    >
</head>

<body>

    <div class="container">

        <h1>📈 AI Trading Assistant</h1>

        <p class="subtitle">
            BTC/USD Multi-Timeframe Chart Analysis
        </p>


        <!-- ========================= -->
        <!-- 1H -->
        <!-- ========================= -->

        <div class="chart-card">

            <h2>🕐 1H Chart</h2>

            <p>
                Higher Timeframe Trend
            </p>

            <input
                type="file"
                id="chart1H"
                accept="image/*"
            >

            <img
                id="preview1H"
                class="preview"
                alt="1H Chart Preview"
            >

        </div>


        <!-- ========================= -->
        <!-- 30M -->
        <!-- ========================= -->

        <div class="chart-card">

            <h2>🕧 30M Chart</h2>

            <p>
                Main Setup
            </p>

            <input
                type="file"
                id="chart30M"
                accept="image/*"
            >

            <img
                id="preview30M"
                class="preview"
                alt="30M Chart Preview"
            >

        </div>


        <!-- ========================= -->
        <!-- 5M -->
        <!-- ========================= -->

        <div class="chart-card">

            <h2>🕔 5M Chart</h2>

            <p>
                Entry Confirmation
            </p>

            <input
                type="file"
                id="chart5M"
                accept="image/*"
            >

            <img
                id="preview5M"
                class="preview"
                alt="5M Chart Preview"
            >

        </div>


        <!-- ========================= -->
        <!-- BUTTONS -->
        <!-- ========================= -->

        <div class="buttons">

            <button
                onclick="analyzeChart()"
                class="analyze-btn"
            >
                🔍 Analyze Charts
            </button>

            <button
                onclick="clearResult()"
                class="clear-btn"
            >
                🗑️ Clear
            </button>

        </div>


        <!-- ========================= -->
        <!-- STATUS -->
        <!-- ========================= -->

        <div id="result"></div>


        <!-- ========================= -->
        <!-- TRADING DECISION -->
        <!-- ========================= -->

        <div
            id="tradingDecision"
            class="result-card"
        >

            <h2>📊 Trading Decision</h2>


            <div
                id="signal"
                class="result-row"
            ></div>


            <div
                id="entry"
                class="result-row"
            ></div>


            <div
                id="stoploss"
                class="result-row"
            ></div>


            <div
                id="target"
                class="result-row"
            ></div>


            <div
                id="reason"
                class="result-row"
            ></div>


            <div
                id="confirmation"
                class="result-row"
            ></div>


            <div
                id="trend"
                class="result-row"
            ></div>


            <div
                id="support"
                class="result-row"
            ></div>


            <div
                id="resistance"
                class="result-row"
            ></div>

        </div>

    </div>


    <!-- ========================= -->
    <!-- JAVASCRIPT -->
    <!-- ========================= -->

    <script src="script.js"></script>

</body>

</html>
