<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Trading Assistant</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

    <h1>📈 AI Trading Assistant</h1>

    <p>Select your Trading Chart</p>

    <input type="file" id="imageUpload" accept="image/*">

    <br><br>

    <img id="preview" style="display:none;max-width:100%;border-radius:10px;">

    <br><br>

    <button onclick="analyzeChart()">Analyze Chart</button>

    <button onclick="clearResult()">Clear</button>

    <hr>

    <div id="result"></div>

    <h3>📊 Analysis Result</h3>

    <div id="signal"></div>
    <div id="entry"></div>
    <div id="stoploss"></div>
    <div id="target"></div>
    <hr>

<h3>📊 Trade Summary</h3>

<table style="width:100%;border-collapse:collapse;">
<tr>
    <th>Trend</th>
    <th>Signal</th>
    <th>Confidence</th>
</tr>

<tr>
    <td id="trendCell">-</td>
    <td id="signalCell">-</td>
    <td id="confidenceCell">-</td>
</tr>
</table>

</div>

<script src="script.js"></script>

</body>
</html>
