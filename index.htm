<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>AI Trading Assistant</title>
</head>

<body>

<h1>📈 AI Trading Assistant</h1>

<p>Upload your BTC/USD trading charts</p>

<hr>

<h3>🕐 1H Chart — Trend</h3>

<input type="file" id="chart1H" accept="image/*">

<br><br>

<img
    id="preview1H"
    style="display:none;max-width:100%;border-radius:10px;"
>

<hr>

<h3>🕧 30M Chart — Main Setup</h3>

<input type="file" id="chart30M" accept="image/*">

<br><br>

<img
    id="preview30M"
    style="display:none;max-width:100%;border-radius:10px;"
>

<hr>

<h3>🕔 5M Chart — Entry Confirmation</h3>

<input type="file" id="chart5M" accept="image/*">

<br><br>

<img
    id="preview5M"
    style="display:none;max-width:100%;border-radius:10px;"
>

<br><br>

<button onclick="analyzeChart()">🔍 Analyze</button>

<button onclick="clearResult()">Clear</button>

<hr>

<div id="result"></div>

<h3>📊 Trading Decision</h3>

<div id="signal"></div>

<div id="entry"></div>

<div id="stoploss"></div>

<div id="target"></div>

<div id="rr"></div>

<div id="reason"></div>


<!-- IMPORTANT: CONNECT JAVASCRIPT -->

<script src="script.js"></script>

</body>
</html>
