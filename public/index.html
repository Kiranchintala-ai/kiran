<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>AI Trading Assistant</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>

<body>

<div class="container">

    <h1>📈 AI Trading Assistant</h1>

    <p class="subtitle">
        BTC/USD Live EMA9 + EMA26 Analysis
    </p>


    <!-- ========================= -->
    <!-- LIVE PRICE -->
    <!-- ========================= -->

    <div class="result-card">

        <h2>💰 BTC/USD</h2>

        <div
            id="price"
            class="result-row"
        >
            Price: -
        </div>

        <div
            id="updated"
            class="result-row"
        >
            Updated: -
        </div>

    </div>


    <!-- ========================= -->
    <!-- MARKET TREND -->
    <!-- ========================= -->

    <div class="result-card">

        <h2>📊 Market Trend</h2>

        <div
            id="trend4h"
            class="result-row"
        >
            4H Trend: -
        </div>

        <div
            id="trend1h"
            class="result-row"
        >
            1H Trend: -
        </div>

        <div
            id="trend30m"
            class="result-row"
        >
            30M Trend: -
        </div>

    </div>


    <!-- ========================= -->
    <!-- EMA CROSSOVER -->
    <!-- ========================= -->

    <div class="result-card">

        <h2>📈 EMA9 / EMA26</h2>

        <div
            id="crossover"
            class="result-row"
        >
            30M Crossover: -
        </div>

    </div>


    <!-- ========================= -->
    <!-- TRADING DECISION -->
    <!-- ========================= -->

    <div
        id="tradingDecision"
        class="result-card"
    >

        <h2>🚦 Trading Decision</h2>


        <div
            id="signal"
            class="result-row"
        >
            Signal: -
        </div>


        <div
            id="entry"
            class="result-row"
        >
            Entry: -
        </div>


        <div
            id="stoploss"
            class="result-row"
        >
            Stop Loss: -
        </div>


        <div
            id="target"
            class="result-row"
        >
            Target: -
        </div>


        <div
            id="rr"
            class="result-row"
        >
            Risk Reward: -
        </div>

    </div>


    <!-- ========================= -->
    <!-- STATUS -->
    <!-- ========================= -->

    <div
        id="result"
        class="status"
    >
        🔄 Connecting to live market...
    </div>


    <!-- ========================= -->
    <!-- CROSSOVER NOTIFICATION -->
    <!-- ========================= -->

    <div
        id="notification"
        class="notification"
        style="display:none;"
    ></div>


    <!-- ========================= -->
    <!-- REFRESH -->
    <!-- ========================= -->

    <button
        id="refreshBtn"
        onclick="getLiveAnalysis()"
        class="analyze-btn"
    >
        🔄 Refresh Analysis
    </button>

</div>


<script src="script.js"></script>

</body>

</html>
