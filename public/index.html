<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>AI Trading Assistant</title>

    <link
        rel="stylesheet"
        href="style.css"
    >
</head>

<body>

<div class="container">

    <h1>📈 AI Trading Assistant</h1>

    <p class="subtitle">
        BTC/USD Live Multi-Timeframe Analysis
    </p>


    <!-- LIVE PRICE -->

    <div class="result-card">

        <h2>💰 Live BTC/USD</h2>

        <div
            id="price"
            class="result-row"
        >
            Price: -
        </div>

        <div
            id="updated"
            class="result-row"
        >
            Updated: -
        </div>

    </div>


    <!-- TREND -->

    <div class="result-card">

        <h2>📊 Market Trend</h2>

        <div
            id="trend4h"
            class="result-row"
        >
            4H Trend: -
        </div>

        <div
            id="trend1h"
            class="result-row"
        >
            1H Trend: -
        </div>

    </div>


    <!-- EMA -->

    <div class="result-card">

        <h2>📈 EMA 9 / EMA 26</h2>

        <div
            id="crossover"
            class="result-row"
        >
            30M Crossover: -
        </div>

        <div
            id="confirmation"
            class="result-row"
        >
            5M Confirmation: -
        </div>

    </div>


    <!-- SIGNAL -->

    <div
        id="tradingDecision"
        class="result-card"
    >

        <h2>🚦 Trading Decision</h2>

        <div
            id="signal"
            class="result-row"
        >
            Signal: -
        </div>

        <div
            id="support"
            class="result-row"
        >
            Support: -
        </div>

        <div
            id="resistance"
            class="result-row"
        >
            Resistance: -
        </div>

    </div>


    <!-- STATUS -->

    <div
        id="result"
        class="status"
    >
        🔄 Connecting to live market...
    </div>


    <!-- NOTIFICATION -->

    <div
        id="notification"
        class="notification"
        style="display:none;"
    ></div>


    <button
        id="refreshBtn"
        onclick="getLiveAnalysis()"
        class="analyze-btn"
    >
        🔄 Refresh Analysis
    </button>

</div>


<script src="script.js"></script>

</body>

</html>
