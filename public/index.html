<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Dual Trading Assistant</title>
  <style>
    body {
      background-color: #0b0e14;
      color: #e2e8f0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      padding: 20px;
    }
    .container {
      max-width: 600px;
      margin: 0 auto;
    }
    h1 {
      font-size: 1.4rem;
      text-align: center;
      margin-bottom: 20px;
      color: #38bdf8;
    }
    .card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 16px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
    }
    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }
    .asset-title {
      font-size: 1.1rem;
      font-weight: 700;
    }
    .badge {
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 0.75rem;
      font-weight: 600;
    }
    .badge-buy { background: #166534; color: #4ade80; }
    .badge-sell { background: #991b1b; color: #f87171; }
    .badge-neutral { background: #334155; color: #94a3b8; }
    .details {
      font-size: 0.9rem;
      line-height: 1.6;
    }
    .btn {
      display: block;
      width: 100%;
      background: #2563eb;
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 12px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      margin-top: 10px;
    }
    .btn:active { background: #1d4ed8; }
    .status-text {
      text-align: center;
      font-size: 0.8rem;
      color: #64748b;
      margin-top: 15px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>⚡ AI Trading Assistant</h1>

    <!-- BTC/USD Card -->
    <div class="card">
      <div class="card-header">
        <span class="asset-title">🪙 BTC/USD (24/7)</span>
        <span id="btc-badge" class="badge badge-neutral">Scanning</span>
      </div>
      <div id="btc-content" class="details">Checking recent 15M candles...</div>
    </div>

    <!-- NIFTY 50 Card -->
    <div class="card">
      <div class="card-header">
        <span class="asset-title">🇮🇳 NIFTY 50 (NSE)</span>
        <span id="nifty-badge" class="badge badge-neutral">Scanning</span>
      </div>
      <div id="nifty-content" class="details">Checking Indian market data...</div>
    </div>

    <!-- Actions -->
    <button class="btn" onclick="fetchSignals()">🔄 Refresh Signals</button>
    <button class="btn" style="background:#059669;" onclick="triggerTestPush()">🔔 Test Notification</button>

    <div id="status-footer" class="status-text">Connecting to scanner engine...</div>
  </div>

  <script>
    async function fetchSignals() {
      try {
        const res = await fetch('/api/signals');
        if (!res.ok) throw new Error("HTTP error " + res.status);
        const data = await res.json();

        // Render BTC
        renderAsset('btc', data.btc);
        // Render Nifty
        renderAsset('nifty', data.nifty);

        document.getElementById('status-footer').innerText = 
          `Subscribers: ${data.subscribers} | Auto-updated: ${new Date().toLocaleTimeString()}`;
      } catch (err) {
        document.getElementById('status-footer').innerText = "Syncing with engine... (Wait a moment)";
      }
    }

    function renderAsset(prefix, setup) {
      const badge = document.getElementById(`${prefix}-badge`);
      const content = document.getElementById(`${prefix}-content`);

      if (!setup || setup.status) {
        badge.className = "badge badge-neutral";
        badge.innerText = "WAITING";
        content.innerHTML = `<div>${setup ? setup.status : 'No current setup'}</div>`;
        return;
      }

      const isBuy = setup.signal === 'BUY';
      badge.className = isBuy ? "badge badge-buy" : "badge badge-sell";
      badge.innerText = setup.signal;

      content.innerHTML = `
        <div><strong>Pattern:</strong> ${setup.pattern}</div>
        <div><strong>Entry:</strong> ${setup.entry}</div>
        <div><strong>Stop Loss:</strong> ${setup.stopLoss}</div>
        <div><strong>Target:</strong> ${setup.target} (1:2 R:R)</div>
      `;
    }

    async function triggerTestPush() {
      window.location.href = '/test-notification';
    }

    // Auto fetch on load and every 15s
    fetchSignals();
    setInterval(fetchSignals, 15000);
  </script>
</body>
</html>
